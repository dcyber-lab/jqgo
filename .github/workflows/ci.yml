name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: fuzz (short)
        run: |
          go test -run '^$' -fuzz FuzzQuery -fuzztime 30s .
          go test -run '^$' -fuzz FuzzInPlace -fuzztime 30s .
          go test -run '^$' -fuzz FuzzFastPath -fuzztime 30s .
          go test -run '^$' -fuzz FuzzDecode -fuzztime 30s .
          go test -run '^$' -fuzz FuzzStream -fuzztime 30s .
          go test -run '^$' -fuzz FuzzParallel -fuzztime 30s .
